server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html index.htm;

  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  # TLS must terminate before this container; the ingress sends HSTS on HTTPS responses.

  # 避免目录重定向降级为 http（入口链接无尾斜杠时 try_files $uri/ 会 301），
  # 使用相对重定向以保留入站 HTTPS 协议。
  absolute_redirect off;
  port_in_redirect off;

  # 回调页 URL 携带一次性 code，禁止通过 Referer 头泄漏给第三方资源
  add_header Referrer-Policy "no-referrer" always;

  # SaaS 网关反向代理：/api/ 业务接口 + /oauth/ 授权端点（authorize/token/userinfo）
  location /oauth/ {
    proxy_pass http://gateway:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ^~ 必须保留：正则 location（\.png|jpg|...）在 nginx 里优先于前缀 location，
  # 公共图片 /api/v1/media-public/{bucket}/{key} 恰好以 .png/.jpg 结尾，
  # 若不加 ^~ 会被静态资源 location 抢走、按本地文件 404。加了 ^~ 后 /api/** 一律交给网关。
  location ^~ /api/ {
    proxy_pass http://gateway:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /a380 {
    try_files /a380/index.html =404;
  }

  location = /b {
    try_files /b/index.html =404;
  }

  # 入口 HTML 一律不缓存，保证 H5 版本升级后（尤其 APP WebView）刷新即加载最新入口
  location ~ \/index\.html$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires 0;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
  }

  # js/css 不缓存：WebView 强缓存会导致 H5 更新不生效，统一 no-store
  location ~* \.(js|css)$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
  }

  location ~* \.(png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
  }
}
